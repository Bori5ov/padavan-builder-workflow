name: Matrix Build (All Configs)

on:
  workflow_dispatch:

jobs:
  call-template:
    strategy:
      matrix:
        router_config:
          - rt-n11p_oc_cpu.config
          - rt-n11p_oc_cpu-new.config
          - rt-n11pb1.config
          - tl_wr841n-v13.config
          - tl_wr841n-v13_usb.config
          - tl_wr841n-v14.config
          - tl_wr841n-v14_8m.config
      fail-fast: false
    
    uses: ./.github/workflows/_build-template.yml
    with:
      config_file: ${{ matrix.router_config }}
name: Build Template

on:
  workflow_call:
    inputs:
      config_file:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/hadzhioglu/padavan-ng
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Get variables
        run: |
          sed -i 's|\r$||g' variables configs/${{ inputs.config_file }}
          . <(cat variables configs/${{ inputs.config_file }})
          PADAVAN_THEMES="${PADAVAN_THEMES[*]}"
          for v in "${!PADAVAN_@}" "${!CONFIG_@}"; do
            echo "$v=${!v}" >> $GITHUB_ENV
          done
          echo "VENDOR_LOWER=$(echo $CONFIG_VENDOR | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]')" >> $GITHUB_ENV
          echo "PRODUCT_LOWER=$(echo $CONFIG_FIRMWARE_PRODUCT_ID | tr '[:upper:]' '[:lower:]' | tr '_' '-' | tr -cd '[:alnum:]-')" >> $GITHUB_ENV
          echo "WIFI_DRIVER=$CONFIG_FIRMWARE_WIFI2_DRIVER" >> $GITHUB_ENV

      - name: Download sources
        run: |
          git config --global --add safe.directory '*'
          git clone -b "$PADAVAN_BRANCH" "$PADAVAN_REPO" padavan-ng
          git -C padavan-ng checkout "$PADAVAN_COMMIT"
          COMMIT_HASH=$(git -C padavan-ng rev-parse --short HEAD)
          echo "Building from commit: $COMMIT_HASH"
          echo "PADAVAN_COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          wget -qO- "$PADAVAN_TOOLCHAIN_URL" | tar -C padavan-ng --zstd -xf -

      - name: Install themes
        run: |
          if [[ -n $PADAVAN_THEMES ]]; then
            git clone --depth 1 -b "$PADAVAN_THEMES_BRANCH" "$PADAVAN_THEMES_REPO" themes
            cp -r themes/common-theme themes/jquery.js padavan-ng/trunk/user/www/n56u_ribbon_fixed
            for theme in $PADAVAN_THEMES; do
              cp -r "themes/$theme-theme" padavan-ng/trunk/user/www/n56u_ribbon_fixed
            done
          fi

      - name: Pre-build script
        run: '[[ -f pre-build.sh ]] && . pre-build.sh || :'

      - name: Build firmware
        run: |
          cp configs/${{ inputs.config_file }} padavan-ng/trunk/.config
          cd padavan-ng/trunk
          ./clear_tree.sh
          ./build_firmware.sh
          FW_FILE_NAME="$(find images -type f -regextype posix-extended -iregex ".*\.(trx|bin)$" \
                          -printf "%T@\t%f\n" | sort -V | tail -1 | cut -f2)"
          [[ -n $FW_FILE_NAME ]] || { echo "Firmware file not found"; exit 1; }
          echo "FW_FILE_NAME=$FW_FILE_NAME" >> $GITHUB_ENV

      - name: Post-build script
        run: '[[ -f post-build.sh ]] && . post-build.sh || :'

      - name: Check firmware size
        run: |
          partitions=padavan-ng/trunk/configs/boards/$CONFIG_VENDOR/$CONFIG_FIRMWARE_PRODUCT_ID/partitions.config
          max_fw_size="$(awk '/Firmware/ { getline; getline; sub(",", ""); print strtonum($2); }' "$partitions")"
          fw_size="$(stat -c %s "padavan-ng/trunk/images/$FW_FILE_NAME")"
          if ((fw_size > max_fw_size)); then
            fw_size_fmtd="$(numfmt --grouping "$fw_size") bytes"
            max_fw_size_fmtd="$(numfmt --grouping "$max_fw_size") bytes"
            echo "Firmware size ($fw_size_fmtd) exceeds max size ($max_fw_size_fmtd)"
            exit 1
          else
            echo "Firmware size ($fw_size bytes) fits within the limit ($max_fw_size bytes)"
          fi

      - name: Prepare artifacts
        run: |
          TIMESTAMP=$(date '+%Y%m%d-%H%M%S')
          CONFIG_NAME="${{ inputs.config_file }}"
          BASE_NAME="${CONFIG_NAME%.config}"
          ARCHIVE_NAME="padavan-$BASE_NAME-$TIMESTAMP"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
          mkdir -p release
          cp "padavan-ng/trunk/images/$FW_FILE_NAME" release/
          cp "configs/${{ inputs.config_file }}" release/build.config

      - name: Upload artifacts
        uses: actions/upload-artifact@v8
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: release/
          retention-days: 7
name: Manual Build

on:
  workflow_dispatch:
    inputs:
      router_config:
        description: 'Select config'
        required: true
        type: choice
        options:
          - rt-n11p_oc_cpu.config
          - rt-n11p_oc_cpu-new.config
          - rt-n11pb1.config
          - tl_wr841n-v13.config
          - tl_wr841n-v13_usb.config
          - tl_wr841n-v14.config
          - tl_wr841n-v14_8m.config

jobs:
  call-template:
    uses: ./.github/workflows/_build-template.yml
    with:
      config_file: ${{ github.event.inputs.router_config }}